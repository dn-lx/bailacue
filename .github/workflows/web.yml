name: BailaCue web
on:
  push:
    branches: [develop]
    paths: ['web/**', 'ipad-processor/**', 'netlify.toml', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'ipad-processor/**', 'netlify.toml', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 -m py_compile tools/convert_drive_library.py tools/convert_library_multi.py tools/local_upload_server.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/convert_library_multi.py --help
      - run: python3 tools/local_upload_server.py --help
      - run: python3 tools/convert_drive_library.py --help
      - name: Parse native iPad Swift files
        run: swiftc -frontend -parse ../ipad-processor/BailaCueProcessor.swiftpm/*.swift
      - name: Compile and run native iPad model smoke tests
        run: |
          swiftc -parse-as-library ../ipad-processor/BailaCueProcessor.swiftpm/Models.swift ../ipad-processor/tests/ModelsSmoke.swift -o /tmp/bailacue-models-smoke
          /tmp/bailacue-models-smoke
      - name: Verify iPad OAuth plist
        run: python3 -c "import plistlib; plistlib.load(open('../ipad-processor/BailaCueProcessor.swiftpm/AppInfo.plist','rb'))"

