name: BailaCue web
on:
  push:
    branches: [develop]
    paths: ['web/**', 'netlify.toml', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'netlify.toml', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
