name: Web mobile visual tests
on:
  push:
    branches: [develop]
    paths: ['web/**', 'tests/web-e2e/**', 'playwright.web.config.ts', '.github/workflows/web-visual.yml']
  pull_request:
    paths: ['web/**', 'tests/web-e2e/**', 'playwright.web.config.ts', '.github/workflows/web-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.web.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bailacue-mobile-visual-evidence
          path: |
            artifacts/web-playwright-results
            artifacts/web-playwright-report
          retention-days: 14
