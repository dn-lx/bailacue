name: Publish Android preview
on:
  push:
    tags: ["v*-preview.*"]
env:
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
  EXPO_PUBLIC_DROPBOX_APP_KEY: ${{ vars.EXPO_PUBLIC_DROPBOX_APP_KEY }}
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build:android
        env:
          BAILACUE_ARCHS: arm64-v8a,x86_64
      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          apk_assets=(artifacts/*.apk)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "${apk_assets[0]}"
          (cd artifacts && sha256sum --check *.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BailaCue-published-preview
          path: artifacts/
  artemis:
    name: ARTEMIS Android device tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install Google ARTEMIS
        run: |
          git clone https://github.com/google/artemis.git /tmp/artemis
          git -C /tmp/artemis checkout 351ca8422f7b5b54e80a9c1ce03a222e02415b6b
          uv sync --project /tmp/artemis --no-dev
      - uses: actions/download-artifact@v4
        with:
          name: BailaCue-published-preview
          path: artifacts
      - name: Verify APK and generate synthetic video
        run: |
          (cd artifacts && sha256sum --check *.sha256)
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -y -f lavfi -i "testsrc2=size=320x240:rate=24,drawtext=text=LEFT:x=12:y=12:fontsize=24:fontcolor=white,drawtext=text=RIGHT:x=222:y=200:fontsize=20:fontcolor=yellow" -f lavfi -i sine=frequency=440 -t 6 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/BailaCue-ARTEMIS.mp4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 3072 -cores 4 -camera-back none -camera-front none
          script: |
            bash scripts/prepare-test-device.sh
            adb wait-for-device
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell input keyevent 82
            adb shell settings put secure show_ime_with_hard_keyboard 1
            uv run --project /tmp/artemis artemis helper install --serial emulator-5554 || uv run --project /tmp/artemis artemis helper install --serial emulator-5554 || echo 'ARTEMIS helper could not enable; using its UIAutomator fallback'
            adb install -r artifacts/*.apk
            adb push /tmp/BailaCue-ARTEMIS.mp4 /sdcard/Download/BailaCue-ARTEMIS.mp4
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/BailaCue-ARTEMIS.mp4
            BAILACUE_ARTEMIS_YOUTUBE_LIVE=1 BAILACUE_ARTEMIS_VIDEO=1 BAILACUE_ARTEMIS_FIXTURE=/tmp/BailaCue-ARTEMIS.mp4 BAILACUE_ARTEMIS_OUT="$GITHUB_WORKSPACE/artifacts/artemis" uv run --project /tmp/artemis python scripts/artemis-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BailaCue-ARTEMIS-device-evidence
          path: artifacts/artemis/
  publish:
    needs: [build, artemis]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BailaCue-published-preview
          path: artifacts
      - name: Publish tested prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum --check *.sha256)
          cp "docs/releases/$GITHUB_REF_NAME.md" /tmp/bailacue-release-notes.md
          printf '\nActual uploaded APK SHA-256:\n\n```text\n' >> /tmp/bailacue-release-notes.md
          cat artifacts/*.sha256 >> /tmp/bailacue-release-notes.md
          printf '```\n' >> /tmp/bailacue-release-notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/*.apk artifacts/*.sha256 --verify-tag --title "BailaCue $GITHUB_REF_NAME — Android preview" --prerelease --notes-file /tmp/bailacue-release-notes.md
