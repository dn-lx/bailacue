name: Android preview APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.json"
      - "app.config.ts"
      - "package-lock.json"
      - "src/**"
      - "modules/**"
      - "scripts/build-android.sh"
      - ".github/workflows/android-preview.yml"
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
  EXPO_PUBLIC_DROPBOX_APP_KEY: ${{ vars.EXPO_PUBLIC_DROPBOX_APP_KEY }}
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run build:android
        env:
          BAILACUE_ARCHS: arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: BailaCue-Android-internal-preview
          path: |
            artifacts/*.apk
            artifacts/*.sha256
