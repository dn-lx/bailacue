name: Checks
on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAILACUE_TEST_BROWSER: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo-doctor
      - run: npm run build:web
      # GitHub's hosted Ubuntu image already supplies Chrome and its libraries.
      # Avoid a second browser/system-dependency installation and its network stalls.
      - run: google-chrome --version
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BailaCue-preview-and-test-evidence
          path: |
            dist
            artifacts/screenshots
            test-results
