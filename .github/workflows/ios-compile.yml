name: iOS simulator compilation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "modules/**"
      - "package-lock.json"
      - "app.json"
      - "app.config.ts"
      - ".github/workflows/ios-compile.yml"
permissions:
  contents: read
concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify SDK58 toolchain
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import subprocess
          version=subprocess.check_output(['xcodebuild','-version'],text=True).splitlines()[0].split()[1]
          parts=tuple(map(int,version.split('.')[:2]))
          assert parts >= (26,4), f'Expo SDK58 requires Xcode26.4+, got {version}'
          PY
      - run: npm ci
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: '1'
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
        env:
          RCT_NEW_ARCH_ENABLED: '1'
      - name: Compile unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          xcodebuild -workspace ios/BailaCue.xcworkspace -scheme BailaCue -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/BailaCueDerivedData" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee artifacts/ios/build.log
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/BailaCueDerivedData/Build/Products/Debug-iphonesimulator/BailaCue.app/Info.plist" > artifacts/ios/bundle-id.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/BailaCueDerivedData/Build/Products/Debug-iphonesimulator/BailaCue.app/Info.plist" > artifacts/ios/version.txt
          printf 'Unsigned simulator compilation succeeded. No physical-device, playback, signing or App Store acceptance is implied.\n' > artifacts/ios/acceptance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BailaCue-iOS-compile-evidence
          path: artifacts/ios/
          retention-days: 5
